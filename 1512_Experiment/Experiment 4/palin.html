<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.25),
            transparent 35%
          ),
          linear-gradient(135deg, #f4e8d6 0%, #e7c9a6 45%, #d8b07a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px;
        color: #4a3423;
      }

      input, button {
        font-family: inherit;
      }

      .container {
        width: min(92vw, 420px);
        margin: 0 auto;
        background: #f8efe2;
        padding: 40px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(80, 54, 30, 0.2);
        border: 2px solid #b98d5f;
        text-align: center;
      }

      .title {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 700;
        color: #6b3f1d;
        letter-spacing: -0.5px;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #7a5a3b;
        font-size: 13px;
        line-height: 1.5;
        font-style: italic;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        margin: 0 0 18px;
        border: 1px solid #c8a67a;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        background: #fffdf8;
        color: #4a3423;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      input:focus {
        border-color: #8a5a2b;
        box-shadow: 0 0 0 3px rgba(138, 90, 43, 0.14);
      }

      button {
        padding: 11px 24px;
        cursor: pointer;
        border: 1px solid #8a5a2b;
        border-radius: 8px;
        background: #d7a96c;
        color: #3d2412;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 3px 8px rgba(90, 58, 31, 0.15);
        transition: transform 0.2s ease;
        margin: 0 0 24px;
      }

      button:hover {
        transform: translateY(-1px);
      }

      #result {
        min-height: 65px;
        margin: 0;
        padding: 14px 16px;
        border-radius: 8px;
        background: #fff9ee;
        color: #6b3f1d;
        font-weight: 600;
        border: 1px solid #e1c6a7;
        line-height: 1.5;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="title">Palindrome Checker</h2>
      <p class="subtitle">
        Enter a word and discover whether it reads the same forward and
        backward.
      </p>

      <input type="text" id="word" placeholder="Enter a word" />

      <button onclick="checkPalindrome()">Check</button>

      <h3 id="result" aria-live="polite"></h3>
    </div>

    <script>
      // Global Scope
      let appName = "Palindrome Checker";

      // Function Declaration
      function cleanString(str) {
        return str.toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      // Function Expression
      const reverseString = function (str) {
        return str.split("").reverse().join("");
      };

      // Closure
      function counter() {
        let count = 0;

        return function () {
          count++;
          return count;
        };
      }

      const checkCount = counter();

      // Arrow Function
      const isPalindrome = (str) => {
        return str === reverseString(str);
      };

      // Main Function
      function checkPalindrome() {
        try {
          let input = document.getElementById("word").value;

          // Local Scope
          let text = cleanString(input);

          if (text === "") {
            throw "Please enter some text.";
          }

          let result = isPalindrome(text)
            ? `"${input}" is a Palindrome✅`
            : `"${input}" is NOT a Palindrome ❌`;

          result += `<br>Checks Performed: ${checkCount()}`;

          document.getElementById("result").innerHTML = result;
        } catch (error) {
          document.getElementById("result").innerHTML =
            `<span style="color:red;">Error: ${error}</span>`;
        } finally {
          console.log(appName + " executed.");
        }
      }
    </script>
  </body>
</html>
